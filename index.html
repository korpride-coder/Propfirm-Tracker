<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF PROP TERMINAL - Full Operational Suite</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #06080d;
            --panel-bg: #0c1019;
            --panel-border: #182234;
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --ff-yellow: #ffb703;
            --neon-red: #ff3366;
            --text-main: #f0f4fc;
            --text-dim: #738294;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            font-size: 13px;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title-wrap h1 {
            font-size: 1.35rem;
            letter-spacing: 1.5px;
            color: var(--ff-yellow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title-wrap p {
            color: var(--neon-cyan);
            font-size: 0.74rem;
            margin-top: 3px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sync-badge {
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: bold;
        }

        /* Buttons */
        .cyber-btn {
            background: linear-gradient(135deg, var(--neon-green), #00bb66);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cyber-btn:hover { opacity: 0.9; }

        .cyber-btn-outline {
            background: transparent;
            border: 1px solid #334460;
            color: var(--text-main);
            padding: 5px 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.75rem;
        }
        .cyber-btn-outline:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .btn-act {
            padding: 3px 7px;
            border-radius: 3px;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid transparent;
            margin-right: 3px;
            font-family: inherit;
        }
        .btn-bal { background: #1c2738; color: var(--neon-cyan); border-color: #2b3e5a; }
        .btn-bal:hover { background: #263852; }
        .btn-edit { background: #1a2233; color: #b8cce6; border-color: #2e3e57; }
        .btn-arch { background: #2b2214; color: #ffbc6b; border-color: #553e1f; }
        .btn-del { background: #35151b; color: #ff8888; border-color: #63222d; }

        /* Inactivity Banner */
        .inactivity-alert-box {
            background: rgba(255, 51, 102, 0.08);
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            padding: 10px 16px;
            margin-bottom: 14px;
            display: none;
        }
        .inactivity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.78rem;
            color: #ff99aa;
        }

        /* KPI Banners */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 12px 16px;
            border-radius: 6px;
        }
        .kpi-card label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .kpi-card .value {
            font-size: 1.35rem;
            font-weight: bold;
            font-family: monospace;
        }

        /* Terminal Tabs */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .tab-btn {
            background: #101624;
            border: 1px solid #1f2b42;
            color: #8da1bc;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--ff-yellow);
            color: #000;
            border-color: var(--ff-yellow);
        }

        /* Section Layout */
        .grid-2col {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        @media (max-width: 1100px) {
            .grid-2col { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .panel-heading {
            font-size: 0.92rem;
            font-weight: bold;
            color: var(--neon-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Accounts Table */
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.78rem;
        }
        th, td {
            padding: 7px 8px;
            border-bottom: 1px solid #141c2c;
            vertical-align: middle;
        }
        th {
            color: var(--text-dim);
            font-weight: 600;
            background: #080b12;
            font-size: 0.72rem;
        }

        /* Progress Bars */
        .progress-track {
            background: #141a27;
            border: 1px solid #232d42;
            border-radius: 3px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 3px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00bb66, var(--neon-green));
            transition: width 0.3s;
        }

        /* Calendar */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .cal-header {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-dim);
            padding: 3px 0;
            font-weight: bold;
        }
        .cal-cell {
            background: #1015
