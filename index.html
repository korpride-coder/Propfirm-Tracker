<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF PROP-FIRM COMMAND TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-pitch: #000000;
            --panel-bg: rgba(8, 8, 12, 0.55);
            --panel-border: rgba(255, 183, 3, 0.3);
            --ff-yellow: #ffb703;
            --ff-orange: #fb5607;
            --ff-red: #ff0055;
            --neon-green: #00ff66;
            --neon-blue: #00f0ff;
            --neon-purple: #b5179e;
            --text-main: #ffffff;
            --text-dim: #a0a5ad;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: var(--bg-pitch);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
        }

        .cyber-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('bg.png') center center / cover no-repeat fixed;
            opacity: 0.35;
            z-index: -1;
            filter: contrast(120%) brightness(90%);
            pointer-events: none;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 20px 80px 20px;
            position: relative;
            z-index: 1;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            background: rgba(4, 4, 6, 0.75);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.15);
            backdrop-filter: blur(6px);
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 86, 7, 0.6));
        }

        .brand-title {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--ff-yellow), var(--ff-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .brand-subtitle {
            margin: 2px 0 0 0;
            font-size: 0.72rem;
            color: var(--neon-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #inactivityBanner {
            display: none;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--ff-red);
            border-left: 5px solid var(--ff-red);
            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.25);
            backdrop-filter: blur(8px);
        }

        .alert-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.82rem;
            color: #ffccd5;
        }

        .alert-item:last-child { margin-bottom: 0; }

        .btn-dismiss {
            background: transparent;
            color: var(--ff-red);
            border: 1px solid var(--ff-red);
            padding: 2px 8px;
            font-size: 0.7rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 3px;
        }
        .btn-dismiss:hover { background: var(--ff-red); color: #000; }

        .terminal-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        .panel-heading {
            margin: 0 0 16px 0;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-heading::before {
            content: '■';
            color: var(--ff-yellow);
            font-size: 0.8rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(6, 6, 10, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(6px);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--ff-yellow);
        }

        .stat-card.green::after { background: var(--neon-green); }
        .stat-card.pink::after { background: var(--ff-red); }
        .stat-card.blue::after { background: var(--neon-blue); }

        .stat-label {
            font-size: 0.74rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
            gap: 20px;
        }

        .chart-box {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 6px;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cal-nav-btn {
            background: transparent;
            color: var(--ff-yellow);
            border: 1px solid var(--ff-yellow);
            padding: 5px 12px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 3px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-day-header {
            text-align: center;
            padding: 8px 4px;
            font-size: 0.75rem;
            color: var(--ff-yellow);
            background: rgba(255, 183, 3, 0.1);
            border-radius: 3px;
            font-weight: bold;
        }

        .cal-cell {
            min-height: 85px;
            background: rgba(5, 5, 8, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: border-color 0.2s;
        }

        .cal-cell:hover {
            border-color: var(--neon-blue);
        }

        .cal-cell.empty {
            background: rgba(0, 0, 0, 0.25);
            border-color: transparent;
        }

        .cal-cell-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cal-date-num {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: bold;
        }

        .cal-today {
            border: 1px solid var(--neon-blue);
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .cal-note-badge {
            font-size: 0.95rem;
            cursor: pointer;
            filter: drop-shadow(0 0 4px var(--ff-yellow));
            position: relative;
        }

        .cal-pnl-pill {
            font-size: 0.72rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
            margin-top: 3px;
            display: inline-block;
        }

        .pill-positive {
            color: var(--neon-green);
            background: rgba(0, 255, 102, 0.12);
        }

        .pill-negative {
            color: var(--ff-red);
            background: rgba(255, 0, 85, 0.12);
        }

        .cyber-tooltip-wrap {
            position: relative;
            display: inline-block;
        }

        .cyber-tooltip-content {
            visibility: hidden;
            opacity: 0;
            width: 250px;
            background: rgba(5, 5, 8, 0.96);
            color: #ffffff;
            text-align: left;
            border: 1px solid var(--ff-yellow);
            border-radius: 4px;
            padding: 10px;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 16px rgba(255, 183, 3, 0.35);
            transition: opacity 0.2s, visibility 0.2s;
            font-size: 0.72rem;
            line-height: 1.4;
            pointer-events: none;
            white-space: normal;
        }

        .cyber-tooltip-wrap:hover .cyber-tooltip-content {
            visibility: visible;
            opacity: 1;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1.2px;
            text-transform:
